# ---------------------------------------------------------------------------
# Autoware (cote ROS 2) pour la demo AWSIM.
# Base sur docker/examples/demos/awsim/docker-compose.yaml du depot
# autowarefoundation/autoware.
#
# Ce fichier vise un Ubuntu natif (affichage X11, GPU NVIDIA via le runtime
# nvidia). Sous WSL2, scripts/_common.sh ajoute automatiquement
# awsim.wsl.yaml (WSLg, /dev/dxg, pilote D3D12) via COMPOSE_FILE.
#
# Services :
#   autoware   -> simulation complete avec AWSIM (e2e_simulator)
#   psim       -> plan B sans AWSIM (planning_simulator, RViz seul)
#   shell      -> shell ROS 2 pour inspecter les topics
# ---------------------------------------------------------------------------

x-common: &common
  image: ${AUTOWARE_IMAGE:-ghcr.io/autowarefoundation/autoware:universe-cuda-humble}
  privileged: true
  runtime: nvidia
  # Indispensable : AWSIM tourne sur l'hote, le DDS doit traverser sans NAT.
  network_mode: host
  # /dev/shm partage avec l'hote : transport FastDDS par memoire partagee
  # entre AWSIM et Autoware (config/fastdds-native.xml).
  ipc: host
  stdin_open: true
  tty: true
  environment:
    - DISPLAY=${DISPLAY:-:0}
    # PC portable hybride (Intel + NVIDIA en mode on-demand) : sans ces deux
    # variables, RViz serait rendu par le GPU Intel, voire en logiciel.
    - __NV_PRIME_RENDER_OFFLOAD=1
    - __GLX_VENDOR_LIBRARY_NAME=nvidia
    - QT_X11_NO_MITSHM=1
    - NVIDIA_DRIVER_CAPABILITIES=all
    - NVIDIA_VISIBLE_DEVICES=all
    # AWSIM v2 parle FastDDS : Autoware doit faire pareil (l'image est
    # configuree en CycloneDDS par defaut, on surcharge donc ici).
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/project/config/${FASTDDS_PROFILE:-fastdds.xml}
    - FASTDDS_DEFAULT_PROFILES_FILE=/opt/project/config/${FASTDDS_PROFILE:-fastdds.xml}
    - HOST_UID=${HOST_UID:-1000}
    - HOST_GID=${HOST_GID:-1000}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ../config:/opt/project/config:ro
    # create_host_path desactive : Compose creerait les dossiers en root et
    # l'utilisateur 'aw' du conteneur ne pourrait pas y ecrire.
    - type: bind
      source: ${HOME}/autoware_data/maps
      target: /home/aw/autoware_data/maps
      bind:
        create_host_path: false
    - type: bind
      source: ${HOME}/autoware_data/ml_models
      target: /home/aw/autoware_data/ml_models
      bind:
        create_host_path: false
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Simulation complete : Autoware pilote le vehicule d'AWSIM.
  autoware:
    <<: *common
    command:
      - bash
      - -c
      - |
        ros2 launch autoware_launch e2e_simulator.launch.xml \
          vehicle_model:=sample_vehicle \
          sensor_model:=awsim_sensor_kit \
          map_path:=/home/aw/autoware_data/maps/Shinjuku-Map/map \
          ${AW_LAUNCH_ARGS:-}
        exec bash

  # Plan B : conduite autonome sans Unity, entierement dans RViz.
  psim:
    <<: *common
    command:
      - bash
      - -c
      - |
        ros2 launch autoware_launch planning_simulator.launch.xml \
          vehicle_model:=sample_vehicle \
          sensor_model:=sample_sensor_kit \
          map_path:=/home/aw/autoware_data/maps/Shinjuku-Map/map \
          ${AW_LAUNCH_ARGS:-}
        exec bash

  # Shell ROS 2 : ros2 topic list / hz / echo, rviz2, diagnostics...
  shell:
    <<: *common
    command: ["bash"]
